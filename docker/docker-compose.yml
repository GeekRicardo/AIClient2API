services:
  aiclient-api:
    # 使用阿里云镜像仓库
    # 使用方法: docker compose up -d
    # 更新镜像: docker compose pull && docker compose up -d
    image: courtify-registry.cn-shenzhen.cr.aliyuncs.com/courtify/aiclient2api:202604170426
    container_name: aiclient2api
    restart: always
    ports:
      - "3300:3000"
      - "8085-8086:8085-8086"
      - "1455:1455"
      - "19876-19880:19876-19880"
    volumes:
      - ../configs:/app/configs
      - ../data:/app/data
      - ../logs:/app/logs
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
